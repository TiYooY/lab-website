# Site information
site_name: CAN Lab
site_author: Dr. Cancan Yang
site_description: Research on sustainable structures, adaptive bridge design, bridge life-cycle assessment, and 3D concrete printing at McMaster University.
site_url: https://tiyooy.github.io/lab-website/
copyright: Copyright &copy; CAN Lab, McMaster University

# 文档源目录
docs_dir: src/docs

# 主题配置
theme:
  name: material
  language: en
  font:
    text: Manrope
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sticky
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/home-hero.js
  - assets/js/publications.js
  
# Markdown扩展
markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 导航配置
nav:
  - Home: index.md
  - Research: research.md
  - Team:
    - Current Members: team/current-members.md
    - Alumni: team/alumni.md
  - Publications: publications.md
  - News:
    - All Updates: news/index.md
    - Lab Life: news/lab-life.md
    - Media & Outreach: news/media.md
  - Join us: join-us.md

# 插件配置
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Research: 研究方向
            Team: 团队成员
            Current Members: 在读成员
            Alumni: 往届成员
            Publications: 发表论文
            News: 新闻动态
            All Updates: 全部动态
            Lab Life: 实验室日常
            Media & Outreach: 媒体与交流
            Join us: 加入我们

extra:
  social:
    - icon: fontawesome/solid/graduation-cap
      link: https://experts.mcmaster.ca/people/yangc106
      name: McMaster Experts
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0000-0001-8596-2265
      name: ORCID
    - icon: fontawesome/solid/envelope
      link: mailto:yangc106@mcmaster.ca
      name: Email the lab
